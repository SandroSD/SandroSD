<title id="t">Technology stack</title>
<desc id="d">Languages: TypeScript, JavaScript. Backend: Node.js, NestJS, Express, REST API, GraphQL, Apollo. Frontend: React, Next.js, Redux, Tailwind CSS. Database: MongoDB, MySQL, MariaDB, SQL Server, DynamoDB, Firebase. Cloud: AWS, Lambda, S3, IAM, RDS, CloudWatch, API Gateway. Messaging and cache: Kafka, RabbitMQ, Redis. Tools: Prisma, Sequelize, Git, GitHub Actions, pnpm. AI tooling: Claude Code, Claude Cowork, Skills, Hooks. Currently learning: Rust, Solana.</desc>
