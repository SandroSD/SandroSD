<title id="t">Technology stack</title>
<desc id="d">Languages: TypeScript, JavaScript. Backend: Node.js, NestJS, Express, GraphQL, Apollo, Prisma, Sequelize. Frontend: React, Next.js, Redux, Tailwind CSS. Database: MongoDB, MySQL, MariaDB, SQL Server, DynamoDB, Firebase. Messaging and cache: Kafka, RabbitMQ, Redis. Cloud and tooling: AWS, GitHub Actions, Git, pnpm.</desc>
